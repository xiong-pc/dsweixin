name: CI

on:
  push:
    branches: [main]
  pull_request:

# 并发控制：同一 PR 多次推送时取消旧的 run，节省 minutes
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (PHP 8.3 + Laravel)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, sqlite3, mbstring, openssl, fileinfo
          # 用 PCOV 比 Xdebug 快 10x，仅用于覆盖率收集
          coverage: pcov
          tools: composer:v2

      - name: Install Composer dependencies
        working-directory: backend
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Pint code style check
        working-directory: backend
        run: ./vendor/bin/pint --test

      - name: Prepare Laravel environment
        working-directory: backend
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run tests with coverage
        working-directory: backend
        # --min=30 是保守起步值（项目 130 个 Feature test 实际覆盖率应远高于此）。
        # 首次 CI 跑出真实 baseline 后建议上调至 baseline-5%，作为护栏防止覆盖率倒退。
        run: php artisan test --coverage --min=30

  frontend:
    name: Frontend (Node 20 + Vue 3)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Prettier format check
        working-directory: frontend
        run: npm run format:check

      - name: ESLint check
        working-directory: frontend
        run: npm run lint:check

      - name: Type check
        working-directory: frontend
        run: npm run type-check

      - name: Build
        working-directory: frontend
        run: npm run build
